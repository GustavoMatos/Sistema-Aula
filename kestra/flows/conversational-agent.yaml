id: conversational-agent
namespace: leadtracker.ai

description: |
  Agente conversacional do Lead Tracker com acesso a dados do sistema.
  Recebe mensagens dos usuarios e responde usando AI com memoria de sessao.
  Possui contexto em tempo real sobre leads, pipeline, mensagens e SDR.

inputs:
  - id: user_message
    type: STRING
    description: Mensagem do usuario
  - id: session_id
    type: STRING
    description: ID da sessao para persistir contexto
  - id: tenant_id
    type: STRING
    description: ID do tenant do usuario
  - id: user_id
    type: STRING
    description: ID do usuario
  - id: api_key
    type: STRING
    description: Chave da API Anthropic
  - id: data_context
    type: STRING
    description: JSON com dados do tenant (leads, pipeline, mensagens, SDR)
    defaults: "{}"

tasks:
  - id: agent_task
    type: io.kestra.plugin.ai.agent.AIAgent
    systemMessage: |
      Voce e o assistente inteligente do Lead Tracker, um sistema de gestao de leads e automacao WhatsApp para assessorias de investimentos.

      ## SEU PAPEL
      Voce e um assistente de gestao que ajuda gestores e operadores a entenderem o desempenho do negocio. Voce tem acesso aos dados reais do sistema e deve usa-los para responder perguntas concretas.

      ## DADOS DO SISTEMA (atualizados em tempo real)
      {{ inputs.data_context }}

      ## O QUE VOCE PODE FAZER
      1. **Pipeline e Leads**: Informar quantos leads existem, em qual estagio estao, quais sao os mais recentes, origem dos leads
      2. **Mensagens**: Volume de mensagens recebidas e enviadas na semana, atividade de comunicacao
      3. **Agente SDR**: Status das sessoes de qualificacao automatica (quantos ativos, qualificados, desqualificados)
      4. **Atividade recente**: Ultimas acoes no sistema (leads criados, mensagens, mudancas de estagio)
      5. **Insights e sugestoes**: Analisar os dados e sugerir acoes para melhorar conversao

      ## EXEMPLOS DE PERGUNTAS QUE VOCE RESPONDE
      - "Quantos leads eu tenho?"
      - "Como esta meu pipeline?"
      - "Quantas mensagens recebi essa semana?"
      - "Quais os ultimos leads que chegaram?"
      - "Como esta o agente SDR?"
      - "Qual minha taxa de conversao?"
      - "O que posso fazer para melhorar?"

      ## REGRAS
      - Responda SEMPRE em portugues brasileiro
      - Use os dados reais fornecidos acima — NUNCA invente numeros
      - Se o dado nao estiver disponivel no contexto, diga que nao tem essa informacao no momento
      - Seja conciso e direto — respostas curtas e objetivas
      - Use linguagem profissional mas acessivel
      - Quando apresentar numeros, formate de forma clara (ex: "12 leads", "R$ 300k")
      - Sugira acoes praticas quando relevante
      - Se o usuario perguntar algo fora do escopo do sistema, redirecione educadamente
    prompt: "{{ inputs.user_message }}"
    provider:
      type: io.kestra.plugin.ai.provider.Anthropic
      modelName: claude-sonnet-4-6
      apiKey: "{{ inputs.api_key }}"
    memory:
      type: io.kestra.plugin.ai.memory.KestraKVStore
      memoryId: "{{ inputs.session_id }}"
      ttl: PT1H
    configuration:
      temperature: 0.7
      maxToken: 1024
